[package]
name = "proofstream-milestones"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Samuel-Chuku/proofstream-near"

# Reproducible build (NEP-330): `cargo near build reproducible-wasm` runs this pinned
# image, and `contract_source_metadata` names it with the commit. Same pin as
# cargo-near 0.23.0's own project template.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.99.1"
image_digest = "sha256:c9655eaf7436b90c87ea8b25739f91063032c5c30ba24cfeafe72c142943b5bb"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"
serde_json = "1.0"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
# Sandbox tests (tests/sandbox.rs): a local NEAR node with mock OutLayer and token contracts.
near-workspaces = "=0.24.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
opt-level = "s"
lto = true
debug = false
panic = "abort"
overflow-checks = true

