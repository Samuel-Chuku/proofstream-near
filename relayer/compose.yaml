# Relayer behind Caddy. Values come from relayer/.env (untracked; see .env.example);
# the key comes from secrets/relayer_key.json and the GitHub token from secrets/github_token.txt
# (both untracked; see DEPLOY.md).
services:
  relayer:
    build: .
    image: proofstream-relayer:local
    environment:
      RELAYER_ACCOUNT_ID: ${RELAYER_ACCOUNT_ID:?set in .env}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:?set in .env}
      DAILY_CAP_MILLINEAR: ${DAILY_CAP_MILLINEAR:?set in .env}
      TRUST_PROXY: "1"
      PORT: "8080"
    secrets:
      - relayer_key
      - github_token
    user: node
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 64
    restart: unless-stopped
    # Reachable only on the compose network, i.e. by the proxy.
    expose: ["8080"]
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

  proxy:
    image: caddy:2.11.9-alpine@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee
    depends_on: [relayer]
    environment:
      RELAYER_DOMAIN: ${RELAYER_DOMAIN:?set in .env}
    ports: ["443:443"]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account; kept across restarts so renewals don't re-issue.
      - caddy_data:/data
    read_only: true
    tmpfs:
      - /config
      - /tmp
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

volumes:
  caddy_data:

secrets:
  relayer_key:
    file: ./secrets/relayer_key.json
  # Read-only GitHub token for auto-claim; an empty file turns auto-claim off.
  github_token:
    file: ./secrets/github_token.txt
