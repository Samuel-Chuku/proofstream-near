# Relayer behind Nginx. Values come from relayer/.env (untracked; see .env.example);
# the key comes from secrets/relayer_key.json (untracked; see DEPLOY.md).
services:
  relayer:
    build: .
    image: proofstream-relayer:local
    environment:
      RELAYER_ACCOUNT_ID: ${RELAYER_ACCOUNT_ID:?set in .env}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:?set in .env}
      DAILY_CAP_MILLINEAR: ${DAILY_CAP_MILLINEAR:?set in .env}
      TRUST_PROXY: "1"
      PORT: "8080"
    secrets:
      - relayer_key
    user: node
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 64
    restart: unless-stopped
    # Reachable only on the compose network, i.e. by the proxy.
    expose: ["8080"]
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

  proxy:
    image: nginx:1.30-alpine@sha256:583b7f2fce1cdb8da5ad5c39ebd3c33b98b87d493190e548bdee1fa8c619c311
    depends_on: [relayer]
    environment:
      RELAYER_DOMAIN: ${RELAYER_DOMAIN:?set in .env}
    ports: ["443:443"]
    volumes:
      - ./nginx/relayer.conf.template:/etc/nginx/templates/relayer.conf.template:ro
      # Certificates at /etc/letsencrypt/live/<domain>/ on the host; how they get there is D41.
      - /etc/letsencrypt:/etc/letsencrypt:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /etc/nginx/conf.d
    cap_drop: [ALL]
    # The nginx master binds 443, then switches its workers to the nginx user.
    cap_add: [NET_BIND_SERVICE, CHOWN, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

secrets:
  relayer_key:
    file: ./secrets/relayer_key.json
